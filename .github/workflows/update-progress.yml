name: Cap nhat bao cao tien do

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-progress-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tao va luu bao cao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            python3 scripts/update_progress.py
            git add -- README_TIEN_DO.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'docs: tu dong cap nhat bao cao tien do'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Khong push duoc bao cao. Kiem tra quyen ghi/branch protection va chay lai workflow.' >&2
          exit 1
